<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BIM AR.js Geolocation</title>
    <!-- Importamos A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- Importamos los componentes de geolocalización de AR.js -->
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js'></script>
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Asegura que el vídeo de la cámara cubra toda la pantalla correctamente */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>
    <a-scene vr-mode-ui="enabled: false" arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;" renderer="antialias: true; alpha: true">
        
        <!-- Configuración de la cámara del móvil con GPS -->
        <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

        <!-- Entidad con el modelo 3D georreferenciado (model.glb) -->
        <a-entity 
            gltf-model="url(modelo.glb)" 
            gps-new-entity-place="latitude: 37.1623572718922; longitude: -3.5825698654083933;" 
            scale="1 1 1" 
            rotation="0 45 0">
        </a-entity>

    </a-scene>
</body>
</html>
